<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym-bro — grupo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <header class="group-header">
      <div>
        <a href="index.html" class="brand">Gym-bro</a>
        <h1 id="group-name">Cargando grupo...</h1>
        <p class="muted">Código para invitar: <strong id="group-code" class="code"></strong></p>
      </div>
      <div class="whoami">
        <span id="nickname"></span>
        <button id="leave" type="button" class="secondary">Salir</button>
      </div>
    </header>

    <p id="page-error" class="error" role="alert"></p>

    <div class="columns">
      <form id="session-form" class="card">
        <h2>Cargar sesión</h2>
        <label>Fecha <input name="date" type="date" required></label>
        <table class="sets">
          <thead><tr><th>Ejercicio</th><th>Peso (kg)</th><th>Reps</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <button type="button" id="add-set" class="secondary">Agregar serie</button>
        <button type="submit">Guardar sesión</button>
        <p class="error" role="alert"></p>
        <div id="session-result"></div>
      </form>

      <section class="card">
        <h2>Fuerza relativa</h2>
        <p class="muted">Mejor 1RM estimado dividido por el peso corporal.</p>
        <div id="strength"><p class="muted">Cargando ranking...</p></div>
      </section>
    </div>
  </main>

  <template id="set-row">
    <tr>
      <td><select name="exercise" required></select></td>
      <td><input name="weight" type="number" step="0.5" min="0.5" max="500" required></td>
      <td><input name="reps" type="number" min="1" max="50" required></td>
      <td><button type="button" class="remove secondary" aria-label="Quitar serie">x</button></td>
    </tr>
  </template>

  <script type="module" src="js/group-page.js"></script>
</body>
</html>
