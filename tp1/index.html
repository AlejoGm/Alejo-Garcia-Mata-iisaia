<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus - Registro</title>
    <style>
        /* Variables de color y tipografía para un estilo SaaS moderno */
        :root {
            --primary-blue: #2563eb;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --border-color: #e5e7eb;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Contenedor principal centrado de 640px */
        .container {
            width: 100%;
            max-width: 640px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            box-sizing: border-box;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            margin: 0;
            font-size: 2.25rem;
            color: var(--primary-blue);
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        header p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Indicador de Progreso */
        .progress-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 3rem;
            padding: 0 1rem;
        }

        /* Línea conectora de fondo */
        .progress-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 2rem;
            right: 2rem;
            height: 2px;
            background-color: var(--border-color);
            z-index: 1;
            transform: translateY(-50%);
        }

        .step {
            position: relative;
            z-index: 2;
            background-color: var(--bg-surface);
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* Estilo para el paso activo */
        .step.active {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 600;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Contenido Principal */
        main {
            min-height: 200px; /* Altura mínima para mantener estructura mientras está vacío */
            margin-bottom: 2rem;
        }

        main h2 {
            margin-top: 0;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* Footer y Botones */
        footer {
            display: flex;
            justify-content: flex-end;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        button {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            font-family: var(--font-family);
        }

        button:disabled {
            background-color: var(--text-muted);
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:not(:disabled):hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nimbus</h1>
            <p>Creá tu cuenta en tres pasos</p>
        </header>

        <div class="progress-container" id="progress-indicator">
            <div class="step" data-step="usuario">Usuario</div>
            <div class="step" data-step="password">Contraseña</div>
            <div class="step" data-step="addons">Plan</div>
        </div>

        <main>
            <h2 id="main-title">Elegí tu nombre de usuario</h2>
            <!-- El contenido del formulario irá acá -->
        </main>

        <footer>
            <button id="btn-continuar" disabled>Continuar</button>
        </footer>
    </div>

    <script>
        // Estado global de la aplicación
        // Valores posibles: 'usuario', 'password', 'addons', 'confirmado'
        let paso = 'usuario';

        // Lógica para actualizar el DOM basándose en el estado `paso`
        function renderProgress() {
            const stepsElements = document.querySelectorAll('.step');
            
            stepsElements.forEach(stepEl => {
                const stepName = stepEl.getAttribute('data-step');
                
                // Limpiamos las clases previas
                stepEl.classList.remove('active');
                
                // Si el paso actual coincide con el elemento del DOM, lo destacamos
                if (stepName === paso) {
                    stepEl.classList.add('active');
                }
                
                // Nota: Los otros pasos quedan visualmente "apagados" (estilo por defecto .step)
                // como requiere la especificación.
            });
        }

        // Inicialización cuando carga el documento
        document.addEventListener('DOMContentLoaded', () => {
            renderProgress();
        });

        // Simulación de cambio de estado (puedes usar esto más adelante para navegar)
        function cambiarPaso(nuevoPaso) {
            paso = nuevoPaso;
            renderProgress();
            
            // Actualizar el título a modo de ejemplo si se cambia el paso
            const mainTitle = document.getElementById('main-title');
            if (paso === 'usuario') mainTitle.textContent = 'Elegí tu nombre de usuario';
            if (paso === 'password') mainTitle.textContent = 'Creá una contraseña segura';
            if (paso === 'addons') mainTitle.textContent = 'Seleccioná tu plan';
        }
    </script>
</body>
</html>
