<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimbus - Registro</title>
    <style>
        /* Variables de estilo SaaS */
        :root {
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-hover: #f9fafb;
            --border-color: #e5e7eb;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            box-sizing: border-box;
        }

        /* Header */
        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 { margin: 0; font-size: 2.25rem; color: var(--primary-blue); font-weight: 700; letter-spacing: -0.025em; }
        header p { margin: 0.5rem 0 0; color: var(--text-muted); font-size: 1.1rem; }

        /* Progreso */
        .progress-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 3rem;
            padding: 0 1rem;
        }
        .progress-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 2rem;
            right: 2rem;
            height: 2px;
            background-color: var(--border-color);
            z-index: 1;
            transform: translateY(-50%);
        }
        .step {
            position: relative;
            z-index: 2;
            background-color: var(--bg-surface);
            padding: 0.5rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
        }
        .step.active {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 600;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Main y Título */
        main { min-height: 250px; margin-bottom: 2rem; }
        main h2 { margin-top: 0; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; }

        /* Paso: Usuario - Dropdowns */
        .dropdowns-row {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .dropdown { position: relative; width: 56px; height: 56px; }
        .dropdown-toggle {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background-color: #fff; border: 2px solid var(--border-color); border-radius: 8px;
            font-family: var(--font-mono); font-size: 1.5rem; color: var(--text-dark);
            cursor: pointer; user-select: none; transition: border-color 0.2s;
        }
        .dropdown-toggle:hover { border-color: var(--text-muted); }
        .dropdown.open .dropdown-toggle { border-color: var(--primary-blue); }
        .dropdown-menu {
            display: none; position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
            width: 70px; max-height: 200px; overflow-y: auto; background: var(--bg-surface);
            border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .dropdown.open .dropdown-menu { display: block; }
        .dropdown-item {
            padding: 10px; text-align: center; font-family: var(--font-mono); font-size: 1.25rem; cursor: pointer;
        }
        .dropdown-item:hover { background-color: var(--bg-hover); color: var(--primary-blue); }
        .user-preview {
            text-align: center; font-family: var(--font-mono); font-size: 2rem; letter-spacing: 0.5rem;
            color: var(--text-dark); padding: 1rem; background: var(--bg-body); border-radius: 8px;
            border: 1px dashed var(--border-color); min-height: 3rem; display: flex; align-items: center; justify-content: center;
        }

        /* Paso: Contraseña */
        .pw-container { display: flex; flex-direction: column; gap: 1rem; }
        .pw-wrapper { display: flex; gap: 0.5rem; align-items: stretch; }
        .pw-input {
            flex: 1; padding: 0.75rem 1rem; font-size: 1.25rem; font-family: var(--font-mono);
            border: 2px solid var(--border-color); border-radius: 8px; box-sizing: border-box; outline: none;
            transition: border-color 0.2s; background: #fff;
        }
        .pw-input:focus { border-color: var(--primary-blue); }
        .eye-btn {
            background: #fff; border: 2px solid var(--border-color); border-radius: 8px;
            padding: 0 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; transition: border-color 0.2s, background-color 0.2s;
        }
        .eye-btn:hover { border-color: var(--text-muted); background-color: var(--bg-hover); }
        .rules-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem; }
        .rule-item {
            padding: 0.75rem 1rem; background-color: #fef2f2; border: 1px solid #fca5a5;
            border-radius: 8px; font-size: 0.95rem; color: #991b1b;
        }

        /* Paso: Addons (3x5) */
        .addons-dashboard { display: flex; flex-direction: column; gap: 1rem; }
        .addons-header-info {
            display: flex;
            justify-content: space-between;
            background: var(--bg-body);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            font-weight: 500;
        }
        .total-price.over-budget { color: #dc2626; font-weight: 700; }
        
        .addons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .addon-cell {
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            min-height: 70px;
        }
        .addon-cell:hover { border-color: var(--text-muted); background-color: var(--bg-hover); }
        .addon-cell.contratado {
            background-color: #eff6ff;
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }
        .addon-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
        .addon-price { font-size: 0.8rem; color: var(--text-muted); }
        .addon-cell.contratado .addon-price { color: var(--primary-blue); opacity: 0.8; }

        /* Footer y Botón */
        footer { display: flex; justify-content: flex-end; padding-top: 1.5rem; border-top: 1px solid var(--border-color); }
        button {
            background-color: var(--primary-blue); color: #ffffff; border: none;
            padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 500;
            border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
        }
        button:disabled { background-color: var(--text-muted); opacity: 0.5; cursor: not-allowed; }
        button:not(:disabled):hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nimbus</h1>
            <p>Creá tu cuenta en tres pasos</p>
        </header>

        <div class="progress-container" id="progress-indicator">
            <div class="step" data-step="usuario">Usuario</div>
            <div class="step" data-step="password">Contraseña</div>
            <div class="step" data-step="addons">Plan</div>
        </div>

        <main id="app-root"></main>

        <footer>
            <button id="btn-continuar" disabled>Continuar</button>
        </footer>
    </div>

    <script>
        // --- 1. Utilidades y Datos Estáticos ---
        const baseASCII = Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i));
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        const addonsCatalogo = [
            { name: "Blockchain", price: 34 }, { name: "Feng Shui", price: 7 }, { name: "Karaoke", price: 19 }, { name: "Antivirus", price: 23 }, { name: "Riego", price: 5 },
            { name: "Tarot", price: 16 }, { name: "Dark Mode", price: 3 }, { name: "Veterinaria", price: 28 }, { name: "Fax", price: 9 }, { name: "Quantum", price: 37 },
            { name: "Sommelier", price: 14 }, { name: "Exorcismo", price: 22 }, { name: "Astrología", price: 6 }, { name: "CDN", price: 31 }, { name: "Drones", price: 33 }
        ];

        // --- 2. Estado Global ---
        const estado = {
            paso: 'usuario',
            ordenes: Array.from({ length: 6 }, () => shuffleArray(baseASCII)),
            usuario: Array(6).fill(null),
            abierto: null,
            password: '',
            reglasVisibles: 1,
            passwordVisible: false,
            addons: Array(15).fill(false)
        };

        let eyeTimeout = null;

        const titulos = {
            usuario: 'Elegí tu nombre de usuario',
            password: 'Creá una contraseña',
            addons: 'Seleccioná tu plan',
            confirmado: '¡Cuenta confirmada!'
        };

        // --- 3. Lógica del juego Lights Out para Addons (3 filas x 5 columnas) ---
        function toggleAddonCell(index) {
            const row = Math.floor(index / 5);
            const col = index % 5;

            // Invertir celda clickeada
            estado.addons[index] = !estado.addons[index];

            // Vecinos (Arriba, Abajo, Izquierda, Derecha)
            const vecinos = [
                { r: row - 1, c: col }, // Arriba
                { r: row + 1, c: col }, // Abajo
                { r: row, c: col - 1 }, // Izquierda
                { r: row, c: col + 1 }  // Derecha
            ];

            vecinos.forEach(v => {
                if (v.r >= 0 && v.r < 3 && v.c >= 0 && v.c < 5) {
                    const vIndex = v.r * 5 + v.c;
                    estado.addons[vIndex] = !estado.addons[vIndex];
                }
            });
        }

        function inicializarAddons() {
            do {
                estado.addons.fill(false);
                // Aplicar 4 clicks al azar
                for (let i = 0; i < 4; i++) {
                    const randomIndex = Math.floor(Math.random() * 15);
                    toggleAddonCell(randomIndex);
                }
                // Repetir si quedaron todas en false
            } while (estado.addons.every(val => !val));
        }

        // --- 4. Reglas de Contraseña ---
        const reglas = [
            { id: 1, text: "Empieza con una letra.", check: pw => /^[a-zA-Z]/.test(pw) },
            { id: 2, text: "Mínimo 15 caracteres.", check: pw => pw.length >= 15 },
            { id: 3, text: "Al menos un símbolo de !@#$%^&*()-", check: pw => /[!@#$%^&*()-]/.test(pw) },
            { id: 4, text: "Más de 7 dígitos en total.", check: pw => (pw.match(/\d/g) || []).length > 7 },
            { id: 5, text: "No puede tener dos consonantes seguidas (sin distinguir mayúsculas; la 'y' y la 'ñ' cuentan como consonantes).", 
              check: pw => !/[bcdfghjklmnpqrstvwxyzñ]{2}/i.test(pw) },
            { id: 6, text: "No puede tener dos caracteres iguales seguidos.", 
              check: pw => !/(.)\1/.test(pw) },
            { id: 7, text: "No puede tener dos dígitos consecutivos en valor uno al lado del otro: ni '12' ni '21', ni '89' ni '98'.", 
              check: pw => {
                  for (let i = 0; i < pw.length - 1; i++) {
                      if (/\d/.test(pw[i]) && /\d/.test(pw[i+1])) {
                          if (Math.abs(Number(pw[i]) - Number(pw[i+1])) === 1) return false;
                      }
                  }
                  return true;
              }
            },
            { id: 8, text: "No puede tener una corrida de exactamente 3 dígitos seguidos. Corridas de 1, 2, 4 o más están permitidas.", 
              check: pw => {
                  const corridas = pw.match(/\d+/g) || [];
                  return !corridas.some(corrida => corrida.length === 3);
              }
            },
            { id: 9, text: "Termina con un dígito que aparece una sola vez en toda la contraseña.", 
              check: pw => {
                  if (pw.length === 0) return false;
                  const last = pw[pw.length - 1];
                  if (!/\d/.test(last)) return false;
                  return pw.split('').filter(c => c === last).length === 1;
              }
            },
            { id: 10, text: "La cantidad de caracteres de la contraseña tiene que aparecer dentro de ella como una corrida de dígitos aislada.", 
              check: pw => {
                  if (pw.length === 0) return false;
                  const len = pw.length.toString();
                  const regex = new RegExp(`(^|\\D)${len}(\\D|$)`);
                  return regex.test(pw);
              }
            }
        ];

        function formatChar(char) {
            if (char === null) return '_';
            if (char === ' ') return '␣';
            return char.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- 5. Renderizado Central ---
        function render() {
            const activeEl = document.activeElement;
            const isPwFocused = activeEl && activeEl.id === 'pw-input';
            let cursorStart = null, cursorEnd = null;
            if (isPwFocused) {
                cursorStart = activeEl.selectionStart;
                cursorEnd = activeEl.selectionEnd;
            }

            document.querySelectorAll('.step').forEach(stepEl => {
                const isActive = stepEl.getAttribute('data-step') === estado.paso;
                stepEl.classList.toggle('active', isActive);
            });

            const root = document.getElementById('app-root');
            let html = `<h2>${titulos[estado.paso]}</h2>`;
            let disableBtn = true;

            if (estado.paso === 'usuario') {
                html += `<div class="dropdowns-row">`;
                for (let i = 0; i < 6; i++) {
                    const isOpen = estado.abierto === i;
                    html += `
                        <div class="dropdown ${isOpen ? 'open' : ''}">
                            <div class="dropdown-toggle" data-index="${i}">
                                ${formatChar(estado.usuario[i])}
                            </div>
                            <div class="dropdown-menu">
                                ${estado.ordenes[i].map(char => `
                                    <div class="dropdown-item" data-index="${i}" data-code="${char.charCodeAt(0)}">${formatChar(char)}</div>
                                `).join('')}
                            </div>
                        </div>`;
                }
                html += `</div>`;
                html += `<div class="user-preview">${estado.usuario.map(formatChar).join('')}</div>`;

                const completo = !estado.usuario.includes(null);
                const empiezaConLetra = estado.usuario[0] !== null && /^[A-Za-z]$/.test(estado.usuario[0]);
                disableBtn = !(completo && empiezaConLetra);

            } else if (estado.paso === 'password') {
                const inputType = estado.passwordVisible ? 'text' : 'password';
                const eyeIcon = estado.passwordVisible ? '👁️‍🗨️' : '👁️';

                html += `<div class="pw-container">`;
                html += `<div class="pw-wrapper">`;
                html += `<input type="${inputType}" id="pw-input" class="pw-input" value="${escapeHtml(estado.password)}" placeholder="Escribí acá tu contraseña..." autocomplete="off" spellcheck="false" />`;
                html += `<button type="button" id="eye-btn" class="eye-btn" title="Mostrar/Ocultar contraseña">${eyeIcon}</button>`;
                html += `</div>`;
                
                html += `<ul class="rules-list">`;
                let todasCumplen = true;

                for (let i = 0; i < estado.reglasVisibles; i++) {
                    const cumple = reglas[i].check(estado.password);
                    if (!cumple) {
                        todasCumplen = false;
                        html += `<li class="rule-item">${reglas[i].text}</li>`;
                    }
                }
                html += `</ul></div>`;

                disableBtn = !(estado.reglasVisibles === reglas.length && todasCumplen);

            } else if (estado.paso === 'addons') {
                let totalMensual = 0;
                estado.addons.forEach((contratado, idx) => {
                    if (contratado) totalMensual += addonsCatalogo[idx].price;
                });

                const isOverBudget = totalMensual > 0;

                html += `<div class="addons-dashboard">`;
                html += `<div class="addons-header-info">`;
                html += `<span>Saldo disponible: <strong>$0</strong></span>`;
                html += `<span>Total mensual: <strong class="total-price ${isOverBudget ? 'over-budget' : ''}">$${totalMensual}</strong></span>`;
                html += `</div>`;

                html += `<div class="addons-grid">`;
                addonsCatalogo.forEach((addon, idx) => {
                    const isContratado = estado.addons[idx];
                    html += `
                        <div class="addon-cell ${isContratado ? 'contratado' : ''}" data-addon-index="${idx}">
                            <div class="addon-name">${addon.name}</div>
                            <div class="addon-price">$${addon.price}</div>
                        </div>
                    `;
                });
                html += `</div></div>`;

                disableBtn = (totalMensual !== 0);

            } else {
                html += `<p style="text-align:center; color:var(--text-muted);">¡Gracias por registrarte en Nimbus!</p>`;
            }

            root.innerHTML = html;
            document.getElementById('btn-continuar').disabled = disableBtn;

            if (isPwFocused) {
                const pwInput = document.getElementById('pw-input');
                if (pwInput) {
                    pwInput.focus();
                    try {
                        pwInput.setSelectionRange(cursorStart, cursorEnd);
                    } catch (e) {}
                }
            }
        }

        // --- 6. Lógica y Eventos ---
        document.getElementById('app-root').addEventListener('click', (e) => {
            if (estado.paso === 'usuario') {
                const toggle = e.target.closest('.dropdown-toggle');
                if (toggle) {
                    const index = parseInt(toggle.dataset.index, 10);
                    estado.abierto = (estado.abierto === index) ? null : index;
                    render();
                    return;
                }

                const item = e.target.closest('.dropdown-item');
                if (item) {
                    estado.usuario[parseInt(item.dataset.index, 10)] = String.fromCharCode(parseInt(item.dataset.code, 10));
                    estado.abierto = null;
                    render();
                }
            } else if (estado.paso === 'password') {
                const eyeBtn = e.target.closest('#eye-btn');
                if (eyeBtn) {
                    if (eyeTimeout) clearTimeout(eyeTimeout);

                    estado.passwordVisible = true;
                    render();

                    eyeTimeout = setTimeout(() => {
                        estado.passwordVisible = false;
                        render();
                    }, 1000);
                }
            } else if (estado.paso === 'addons') {
                const cell = e.target.closest('.addon-cell');
                if (cell) {
                    const index = parseInt(cell.dataset.addonIndex, 10);
                    toggleAddonCell(index);
                    render();
                }
            }
        });

        // Evento de escritura para la contraseña
        document.getElementById('app-root').addEventListener('input', (e) => {
            if (e.target.id === 'pw-input' && estado.paso === 'password') {
                estado.password = e.target.value;

                let checkeosActivos = true;
                while (checkeosActivos && estado.reglasVisibles <= reglas.length) {
                    checkeosActivos = true;
                    for (let i = 0; i < estado.reglasVisibles; i++) {
                        if (!reglas[i].check(estado.password)) {
                            checkeosActivos = false;
                            break;
                        }
                    }
                    
                    if (checkeosActivos && estado.reglasVisibles < reglas.length) {
                        estado.reglasVisibles++;
                    } else {
                        break;
                    }
                }
                render();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown') && estado.abierto !== null) {
                estado.abierto = null;
                render();
            }
        });

        document.getElementById('btn-continuar').addEventListener('click', () => {
            if (estado.paso === 'usuario') {
                estado.paso = 'password';
                render();
            } else if (estado.paso === 'password') {
                estado.paso = 'addons';
                inicializarAddons();
                render();
            } else if (estado.paso === 'addons') {
                estado.paso = 'confirmado';
                render();
            }
        });

        document.addEventListener('DOMContentLoaded', render);

    </script>
</body>
</html>
